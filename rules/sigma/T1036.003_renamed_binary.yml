title: Potential Defense Evasion Via Binary Rename
id: 771d0854-4c17-4b16-b2c0-6d6101b54720
related:
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    type: derived
status: experimental
description: >
  Detects execution of a renamed system utility by comparing the PE OriginalFileName
  against the on-disk Image name (T1036.003). Source of truth for lab rule 100007. The
  deployed detection is the Wazuh XML in lab/siem/local_rules.xml, validated live with the
  T1036.003 atomic. Derived from SigmaHQ proc_creation_win_renamed_binary.
references:
  - https://attack.mitre.org/techniques/T1036/003/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_renamed_binary.yml
author: Matthew Green @mgreen27, Ecco, oscd.community (original SigmaHQ rule), adapted by Stephen Laing
date: 2026-11-10
tags:
  - attack.stealth
  - attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    OriginalFileName:
      - 'Cmd.Exe'
      - 'CONHOST.EXE'
      - '7z.exe'
      - '7za.exe'
      - '7zr.exe'
      - 'WinRAR.exe'
      - 'wevtutil.exe'
      - 'net.exe'
      - 'net1.exe'
      - 'netsh.exe'
      - 'InstallUtil.exe'
  filter:
    Image|endswith:
      - '\cmd.exe'
      - '\conhost.exe'
      - '\7z.exe'
      - '\7za.exe'
      - '\7zr.exe'
      - '\WinRAR.exe'
      - '\wevtutil.exe'
      - '\net.exe'
      - '\net1.exe'
      - '\netsh.exe'
      - '\InstallUtil.exe'
  condition: selection and not filter
falsepositives:
  - Software that renames these utilities as part of legitimate operation
  - 'Measured against this lab''s benign baseline: see results/runs.csv (fp_cost_5runs)'
level: medium