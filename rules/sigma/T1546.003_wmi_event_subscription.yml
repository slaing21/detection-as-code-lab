description: >
  Detects creation of a WMI event subscription (filter, consumer or binding) used for persistence (T1546.003).
  Source of truth for lab rule 100004. The deployed detection is the Wazuh XML in
  lab/siem/local_rules.xml, validated live with the T1546.003 atomic. Derived from SigmaHQ
  sysmon_wmi_event_subscription.
references:
  - https://attack.mitre.org/techniques/T1546/003/
