author: Tom Ueltschi (original SigmaHQ rule), adapted by Stephen Laing
date: 2026-11-09
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1546.003
logsource:
  product: windows
  category: wmi_event
detection:
  selection:
    EventID:
      - 19
      - 20
      - 21
  condition: selection
falsepositives:
  - Legitimate (vetted) use of WMI event subscriptions, such as management and monitoring agents
  - 'Measured against this lab''s benign baseline: see results/runs.csv (fp_cost_5runs)'
level: medium